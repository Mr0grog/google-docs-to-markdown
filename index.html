<!doctype html><head><meta charset=utf-8><title>Convert Google Doc to Markdown</title><link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro" rel=stylesheet><style type=text/css>@charset "UTF-8";*{box-sizing:border-box}body,html{background:#eee;height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Open Sans,Helvetica Neue,sans-serif}body{flex-direction:column;display:flex}main{flex:auto;flex-direction:row;justify-content:space-between;width:100%;padding:1em 2em;display:flex}#app-header{flex:none;margin:0;padding:1em 2em}#app-header h1{margin:0 0 .5em;padding:0}#settings{flex-flow:wrap;justify-content:flex-start;align-items:baseline;gap:1em;font-size:.75rem;display:flex}#settings input,#settings select{font-size:inherit}.input-field{border:1px solid #ccc;padding:1em;font-size:1em;overflow:auto}#input-area{width:calc(50% - 1em);position:relative}.instructions{opacity:.5;text-align:center;padding:0 1em;font-size:2em;font-weight:700;position:absolute;top:1em;left:0;right:0}#input{z-index:1;position:absolute;left:0;top:0;right:0;bottom:0}#output-area{width:calc(50% - 1em);position:relative}#output{z-index:1;white-space:pre-wrap;background:none;width:100%;height:100%;position:absolute;left:0;top:0}#app-footer{flex:none;margin:0;padding:0 2em 1em;font-style:italic}#button-container{z-index:2;position:absolute;right:0;top:0}#input h1,#input h2,#input h3,#input h4,#input h5,#input h6{font-weight:400;text-decoration:none}#input a[id^="id."]:before,#input a[name^="id."]:before{content:"※ "}</style></head><body>
    <header id=app-header>
      <h1>Convert Google Docs to Markdown</h1>

      <form id=settings>
        <strong><span aria-hidden=true>⚙️</span> Settings:</strong>

        <label>
          Linkable Headings:
          <select name=headingIds>
            <option value=hidden>None</option>
            <option value=html>Plain Markdown (HTML)</option>
            <option value=extended>Extended Markdown</option>
          </select>
        </label>

        <label>
          Code Blocks:
          <select name=codeBlocks>
            <option value=indented>Indented</option>
            <option value=fenced>Fenced (```)</option>
          </select>
        </label>

        <label>
          Suggested changes:
          <select name=suggestions>
            <option value=show>Show suggestions</option>
            <option value=accept>Accept/use suggestions</option>
            <option value=reject>Reject/ignore suggestions</option>
          </select>
        </label>
      </form>
    </header>

    <main>
      <div id=input-area>
        <p class=instructions>Paste Google Docs text here…</p>
        <div id=input class=input-field contenteditable autocomplete=off></div>
      </div>

      <div id=output-area>
        <div id=button-container>
          <button id=download-button style=display:none>Download Markdown</button>
          <button id=copy-button style=display:none>Copy Markdown</button>
        </div>
        <p class=instructions>…and get your Markdown here</p>
        <textarea id=output class=input-field autocomplete=off></textarea>
      </div>
    </main>

    <footer id=app-footer>
      <p>Source code available on <a href=https://github.com/mr0grog/google-docs-to-markdown target=_blank rel=noopener>Github</a>.</p>
    </footer>
    <script src=bundle.js></script>
  

</body></html>
